<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6f4e37">
  <title>Café Mobile</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topo">
    <h1>☕ Café Mobile</h1>
  </header>

  <main>
    <!-- data-categoria guarda a categoria de cada botão para o JavaScript ler -->
    <div class="filtros">
      <button class="filtro ativo" data-categoria="Todos">Todos</button>
      <button class="filtro" data-categoria="Cafés">Cafés</button>
      <button class="filtro" data-categoria="Geladas">Geladas</button>
      <button class="filtro" data-categoria="Salgados">Salgados</button>
      <button class="filtro" data-categoria="Doces">Doces</button>
    </div>

    <!-- Agora vazia: o JavaScript preenche com os produtos de dados.js -->
    <div id="lista-produtos" class="lista-produtos"></div>
  </main>

  <!-- A ordem importa: primeiro os dados, depois o código que usa os dados -->
  <script src="js/dados.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
